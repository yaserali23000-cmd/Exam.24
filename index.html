<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة الامتحانات الإلكترونية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --card: #1a2235;
    --border: #2a3a55;
    --accent: #3b82f6;
    --accent2: #06b6d4;
    --gold: #f59e0b;
    --green: #10b981;
    --red: #ef4444;
    --text: #e2e8f0;
    --muted: #64748b;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(6,182,212,0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container { position: relative; z-index: 1; width: 100%; max-width: 800px; padding: 24px; }

  .screen { display: none; }
  .screen.active { display: block; }

  .setup-header {
    text-align: center;
    margin-bottom: 36px;
  }
  .setup-header h1 {
    font-family: 'Cairo', sans-serif;
    font-size: 2.4rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .setup-header p { color: var(--muted); font-size: 1rem; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 20px;
  }

  .card-title {
    font-family: 'Cairo', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent2);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 20px;
    background: linear-gradient(var(--accent), var(--accent2));
    border-radius: 2px;
  }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 1rem;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    resize: vertical;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  }
  .form-group select option { background: var(--surface); }

  #questions-list { display: flex; flex-direction: column; gap: 12px; }

  .q-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    position: relative;
    transition: border-color .2s;
  }
  .q-item:hover { border-color: var(--accent); }

  .q-num {
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--accent);
    background: rgba(59,130,246,0.1);
    border-radius: 8px;
    padding: 4px 10px;
    white-space: nowrap;
    margin-top: 2px;
  }

  .q-content { flex: 1; }
  .q-text { font-size: 0.95rem; margin-bottom: 6px; line-height: 1.5; }
  .q-meta { font-size: 0.8rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .q-meta span { display: flex; align-items: center; gap: 4px; }

  .q-delete {
    background: none;
    border: none;
    color: var(--red);
    cursor: pointer;
    font-size: 1.2rem;
    padding: 4px;
    border-radius: 6px;
    transition: background .2s;
    line-height: 1;
  }
  .q-delete:hover { background: rgba(239,68,68,0.1); }

  .choices-builder { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .choice-row { display: flex; gap: 8px; align-items: center; }
  .choice-row input { flex: 1; }
  .choice-correct {
    background: none;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.85rem;
    transition: all .2s;
    white-space: nowrap;
  }
  .choice-correct.active { border-color: var(--green); color: var(--green); background: rgba(16,185,129,0.1); }
  .choice-remove {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all .2s;
  }
  .choice-remove:hover { color: var(--red); }

  .btn-add-choice {
    background: none;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 8px;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.9rem;
    transition: all .2s;
    text-align: center;
  }
  .btn-add-choice:hover { border-color: var(--accent); color: var(--accent); }
